services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env.example
    environment:
      - DISABLE_LLM=1
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:80"
    environment:
      - NEXT_PUBLIC_API_URL=/bazimbti/api
    depends_on:
      - backend
    restart: unless-stopped
